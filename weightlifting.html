<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>20-Week OLY Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a38;
    --text: #e8e8f0;
    --muted: #6b6b88;
    --faint: #2a2a38;

    --phase-aa: #1a3d2a;
    --phase-aa-accent: #3ddc84;
    --phase-hyp: #1a2a3d;
    --phase-hyp-accent: #4da6ff;
    --phase-ms1: #2d1a3d;
    --phase-ms1-accent: #b57aff;
    --phase-ms2: #3d2a1a;
    --phase-ms2-accent: #ff9a3d;
    --phase-peak: #3d1a1a;
    --phase-peak-accent: #ff4d4d;
    --phase-comp: #3d370a;
    --phase-comp-accent: #ffd700;
    --phase-trans: #1a1a1a;
    --phase-trans-accent: #888888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  #app-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-brand { font-family: 'Barlow Condensed', sans-serif; }
  .header-brand .sub { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .header-brand .main { font-size: 18px; font-weight: 900; color: var(--text); line-height: 1; }
  .header-stats { text-align: right; font-size: 11px; }
  .header-stats .label { color: var(--muted); }
  .header-stats .val { color: #ffd700; font-weight: 700; font-size: 13px; }

  /* ── MAIN CONTAINER ── */
  #main { max-width: 480px; margin: 0 auto; padding: 0; }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── WEEK LIST ── */
  #phase-legend {
    padding: 12px 12px 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .legend-pill {
    border-radius: 8px; padding: 6px 10px;
    font-size: 10px; letter-spacing: 0.5px;
    display: flex; gap: 6px; align-items: flex-start;
  }
  .legend-pill .wk { font-weight: 700; white-space: nowrap; }
  .legend-pill .nm { opacity: 0.8; line-height: 1.3; }

  #week-list { padding: 10px 12px 24px; display: flex; flex-direction: column; gap: 8px; }

  .week-card {
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .week-card.selected { border-color: var(--phase-accent, #888); }

  .week-card-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
  }
  .week-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px; font-weight: 900;
    width: 36px; text-align: center;
    line-height: 1; flex-shrink: 0;
    color: var(--muted);
  }
  .week-card.selected .week-num { color: var(--phase-accent, #fff); }
  .week-meta { flex: 1; min-width: 0; }
  .week-phase { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .week-bars { display: flex; gap: 4px; margin-top: 6px; }
  .week-bar { height: 4px; flex: 1; border-radius: 2px; background: var(--faint); }
  .week-bar.done { background: #3ddc84; }
  .week-pct { font-size: 12px; font-weight: 700; color: var(--muted); }
  .week-card.selected .week-pct { color: var(--phase-accent, #fff); }

  .week-days-grid {
    display: none;
    padding: 0 12px 12px;
    grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .week-card.selected .week-days-grid { display: grid; }

  .day-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
    color: var(--text);
    font-family: inherit;
  }
  .day-btn:hover { border-color: var(--phase-accent, #888); }
  .day-btn.workout-done { border-color: #3ddc84; background: rgba(61,220,132,0.08); }

  .day-btn-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .day-label { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .day-done-badge { color: #3ddc84; font-size: 14px; }
  .day-title { font-size: 10px; color: var(--muted); line-height: 1.3; }
  .day-ex-count { font-size: 10px; color: var(--faint); margin-top: 4px; }

  /* ── DAY VIEW ── */
  #day-view { display: none; }
  #day-view.active { display: block; }

  #day-header {
    padding: 12px 14px 14px;
    border-bottom: 1px solid var(--border);
  }
  #back-btn {
    background: none; border: none; color: var(--muted);
    font-family: inherit; font-size: 11px; cursor: pointer;
    padding: 0 0 10px 0; display: flex; align-items: center; gap: 4px;
  }
  #back-btn:hover { color: var(--text); }

  #day-header-content { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  #day-title-block .day-weekday { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
  #day-title-block .day-session { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; line-height: 1.1; margin-top: 2px; }
  #day-title-block .day-phase { font-size: 10px; color: var(--muted); margin-top: 3px; }

  #mark-done-btn {
    flex-shrink: 0;
    border-radius: 10px; padding: 8px 14px;
    font-size: 11px; font-weight: 700; font-family: inherit;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted);
    transition: all 0.15s;
    white-space: nowrap;
  }
  #mark-done-btn:hover { border-color: #3ddc84; color: #3ddc84; }
  #mark-done-btn.done { background: rgba(61,220,132,0.15); border-color: #3ddc84; color: #3ddc84; }

  #day-note {
    margin-top: 10px; padding: 8px 12px;
    background: rgba(0,0,0,0.3); border-radius: 8px;
    font-size: 11px; color: var(--muted); font-style: italic; line-height: 1.5;
    border-left: 3px solid var(--phase-accent-val, #888);
  }

  /* ── EXERCISE LIST ── */
  #exercise-list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .ex-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }
  .ex-card-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  }
  .ex-name { font-size: 14px; font-weight: 700; line-height: 1.2; }
  .ex-badge {
    flex-shrink: 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px; font-weight: 900;
    padding: 2px 8px; border-radius: 6px;
    background: rgba(0,0,0,0.4);
    white-space: nowrap;
  }
  .ex-meta {
    padding: 6px 14px;
    display: flex; gap: 16px;
    font-size: 11px; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .ex-meta span { display: flex; align-items: center; gap: 4px; }

  .set-row { padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .set-btn {
    width: 42px; height: 42px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px; font-weight: 900;
    cursor: pointer;
    transition: all 0.1s;
    display: flex; align-items: center; justify-content: center;
  }
  .set-btn:hover { border-color: var(--phase-accent-val, #888); color: var(--text); }
  .set-btn.done { background: #3ddc84; border-color: #3ddc84; color: #0a0a0f; }

  .rest-day-msg { padding: 16px 14px; font-size: 12px; color: var(--muted); font-style: italic; }

  /* ── DAY NAV ── */
  #day-nav { display: flex; gap: 8px; padding: 4px 12px 32px; }
  .day-nav-btn {
    flex: 1; padding: 13px;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .day-nav-btn:hover { border-color: var(--text); color: var(--text); }
  .day-nav-btn.forward {
    background: var(--surface);
  }

  /* ── PHASE COLORS (applied via JS) ── */
  .ph-aa   { --phase-accent: var(--phase-aa-accent);   background: var(--phase-aa);   color: var(--phase-aa-accent); }
  .ph-hyp  { --phase-accent: var(--phase-hyp-accent);  background: var(--phase-hyp);  color: var(--phase-hyp-accent); }
  .ph-ms1  { --phase-accent: var(--phase-ms1-accent);  background: var(--phase-ms1);  color: var(--phase-ms1-accent); }
  .ph-ms2  { --phase-accent: var(--phase-ms2-accent);  background: var(--phase-ms2);  color: var(--phase-ms2-accent); }
  .ph-peak { --phase-accent: var(--phase-peak-accent); background: var(--phase-peak); color: var(--phase-peak-accent); }
  .ph-comp { --phase-accent: var(--phase-comp-accent); background: var(--phase-comp); color: var(--phase-comp-accent); }
  .ph-trans{ --phase-accent: var(--phase-trans-accent);background: var(--phase-trans);color: var(--phase-trans-accent); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>

const PHASES_LEGEND = [
  { label:"Wk 1-3", name:"Anatomical Adaptation", cls:"ph-aa" },
  { label:"Wk 4-6", name:"Hypertrophy", cls:"ph-hyp" },
  { label:"Wk 7-10", name:"Max Strength I", cls:"ph-ms1" },
  { label:"Wk 11-14", name:"Max Strength II / Power", cls:"ph-ms2" },
  { label:"Wk 15-17", name:"Power / Peaking", cls:"ph-peak" },
  { label:"Wk 18-19", name:"Competition", cls:"ph-comp" },
  { label:"Wk 20", name:"Transition", cls:"ph-trans" },
];

// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
let state = {
  selectedWeek: 0,   // index
  selectedDay: 0,    // index
  completedSets: {},
  completedWorkouts: {},
};

async function loadState() {
  try {
    const r = await fetch("/progress");
    if (r.ok) {
      const p = await r.json();
      state.completedSets = p.sets || {};
      state.completedWorkouts = p.workouts || {};
    }
  } catch(e) {
    // fallback to localStorage if API unreachable
    const s = localStorage.getItem("oly_progress_v1");
    if (s) {
      const p = JSON.parse(s);
      state.completedSets = p.sets || {};
      state.completedWorkouts = p.workouts || {};
    }
  }
}

function saveState() {
  const data = { sets: state.completedSets, workouts: state.completedWorkouts };
  fetch("/progress", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  }).catch(() => {
    // fallback to localStorage if API unreachable
    localStorage.setItem("oly_progress_v1", JSON.stringify(data));
  });
}

function setKey(wIdx, dIdx, eIdx, sNum) {
  return `${wIdx}-${dIdx}-${eIdx}-${sNum}`;
}
function workoutKey(wIdx, dIdx) {
  return `${wIdx}-${dIdx}`;
}

function isSetDone(wIdx, dIdx, eIdx, sNum) {
  return !!state.completedSets[setKey(wIdx, dIdx, eIdx, sNum)];
}
function isWorkoutDone(wIdx, dIdx) {
  return !!state.completedWorkouts[workoutKey(wIdx, dIdx)];
}

function toggleSet(wIdx, dIdx, eIdx, sNum) {
  const k = setKey(wIdx, dIdx, eIdx, sNum);
  state.completedSets[k] = !state.completedSets[k];
  saveState();
}
function toggleWorkout(wIdx, dIdx) {
  const k = workoutKey(wIdx, dIdx);
  state.completedWorkouts[k] = !state.completedWorkouts[k];
  saveState();
}

function getWeekPct(wIdx) {
  const week = PROGRAM.weeks[wIdx];
  let total = 0, done = 0;
  week.days.forEach((day, dIdx) => {
    day.exercises.forEach((ex, eIdx) => {
      if (ex.sets > 0) {
        for (let s = 0; s < ex.sets; s++) {
          total++;
          if (isSetDone(wIdx, dIdx, eIdx, s)) done++;
        }
      }
    });
  });
  return total > 0 ? Math.round((done / total) * 100) : 0;
}

// ════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════

function getAccentColor(phClass) {
  const map = {
    'ph-aa':   '#3ddc84',
    'ph-hyp':  '#4da6ff',
    'ph-ms1':  '#b57aff',
    'ph-ms2':  '#ff9a3d',
    'ph-peak': '#ff4d4d',
    'ph-comp': '#ffd700',
    'ph-trans':'#888888',
  };
  return map[phClass] || '#888888';
}

function renderWeekList() {
  // Legend
  const legend = document.getElementById('phase-legend');
  legend.innerHTML = PHASES_LEGEND.map(p => `
    <div class="legend-pill ${p.cls}">
      <span class="wk">${p.label}</span>
      <span class="nm">${p.name}</span>
    </div>
  `).join('');

  // Weeks
  const list = document.getElementById('week-list');
  list.innerHTML = PROGRAM.weeks.map((week, wIdx) => {
    const selected = wIdx === state.selectedWeek;
    const pct = getWeekPct(wIdx);
    const accent = getAccentColor(week.phClass);
    const barsHtml = week.days.map((d, dIdx) =>
      `<div class="week-bar ${isWorkoutDone(wIdx, dIdx) ? 'done' : ''}"></div>`
    ).join('');

    const daysHtml = week.days.map((day, dIdx) => {
      const done = isWorkoutDone(wIdx, dIdx);
      return `
        <button class="day-btn ${done ? 'workout-done' : ''}"
                style="${done ? '' : `--phase-accent:${accent}`}"
                data-widx="${wIdx}" data-didx="${dIdx}">
          <div class="day-btn-header">
            <span class="day-label" style="color:${done ? '#3ddc84' : accent}">${day.label}</span>
            ${done ? '<span class="day-done-badge">✓</span>' : ''}
          </div>
          <div class="day-title">${day.title}</div>
          <div class="day-ex-count">${day.exercises.length} exercises</div>
        </button>`;
    }).join('');

    return `
      <div class="week-card ${selected ? 'selected' : ''}"
           style="--phase-accent:${accent}"
           data-widx="${wIdx}">
        <div class="week-card-header">
          <div class="week-num">${week.week}</div>
          <div class="week-meta">
            <div class="week-phase">${week.phase}</div>
            <div class="week-bars">${barsHtml}</div>
          </div>
          <div class="week-pct">${pct}%</div>
        </div>
        <div class="week-days-grid">
          ${daysHtml}
        </div>
      </div>`;
  }).join('');

  // Events - week card headers
  document.querySelectorAll('.week-card').forEach(card => {
    card.querySelector('.week-card-header').addEventListener('click', () => {
      const wIdx = parseInt(card.dataset.widx);
      state.selectedWeek = (state.selectedWeek === wIdx) ? -1 : wIdx;
      renderWeekList();
    });
  });

  // Events - day buttons
  document.querySelectorAll('.day-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      state.selectedDay = parseInt(btn.dataset.didx);
      state.selectedWeek = parseInt(btn.dataset.widx);
      showDayView();
    });
  });
}

function showDayView() {
  document.getElementById('week-view').classList.remove('active');
  document.getElementById('day-view').classList.add('active');
  renderDayView();
}

function showWeekView() {
  document.getElementById('day-view').classList.remove('active');
  document.getElementById('week-view').classList.add('active');
  renderWeekList();
}

function renderDayView() {
  const wIdx = state.selectedWeek;
  const dIdx = state.selectedDay;
  const week = PROGRAM.weeks[wIdx];
  const day = week.days[dIdx];
  const accent = getAccentColor(week.phClass);

  // Header
  document.getElementById('dh-weekday').textContent = `Week ${week.week} · ${day.label}`;
  document.getElementById('dh-weekday').style.color = accent;
  document.getElementById('dh-title').textContent = day.title;
  document.getElementById('dh-phase').textContent = week.phase;
  document.getElementById('day-note').textContent = day.note;
  document.getElementById('day-note').style.borderLeftColor = accent;

  // Day header background tint
  const dayHeader = document.getElementById('day-header');
  dayHeader.style.background = '';

  // Mark done btn
  const markBtn = document.getElementById('mark-done-btn');
  const done = isWorkoutDone(wIdx, dIdx);
  markBtn.textContent = done ? '✓ Done' : 'Mark Done';
  markBtn.className = 'done' in markBtn.dataset ? 'done' : '';
  if (done) markBtn.classList.add('done');

  // Exercises
  const exList = document.getElementById('exercise-list');
  exList.innerHTML = day.exercises.map((ex, eIdx) => {
    if (ex.sets === 0) {
      return `
        <div class="ex-card">
          <div class="ex-card-header">
            <div class="ex-name">${ex.name}</div>
          </div>
          <div class="rest-day-msg">Rest day — recovery and mobility only.</div>
        </div>`;
    }
    const setsHtml = Array.from({length: ex.sets}, (_, sIdx) => {
      const isDone = isSetDone(wIdx, dIdx, eIdx, sIdx);
      return `<button class="set-btn ${isDone ? 'done' : ''}"
                      data-widx="${wIdx}" data-didx="${dIdx}"
                      data-eidx="${eIdx}" data-snum="${sIdx}"
                      style="${isDone ? '' : `--phase-accent-val:${accent}`}">
                ${isDone ? '✓' : sIdx + 1}
              </button>`;
    }).join('');

    return `
      <div class="ex-card">
        <div class="ex-card-header">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-badge" style="color:${accent}">${ex.sets}×${ex.reps}</div>
        </div>
        <div class="ex-meta">
          <span>🏋️ ${ex.load}</span>
          <span>⏱ ${ex.rest}</span>
        </div>
        <div class="set-row">${setsHtml}</div>
      </div>`;
  }).join('');

  // Set button events
  document.querySelectorAll('.set-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const w = parseInt(btn.dataset.widx);
      const d = parseInt(btn.dataset.didx);
      const e = parseInt(btn.dataset.eidx);
      const s = parseInt(btn.dataset.snum);
      toggleSet(w, d, e, s);
      renderDayView();
    });
  });

  // Nav buttons
  const nav = document.getElementById('day-nav');
  const prevDay = dIdx > 0 ? week.days[dIdx - 1] : null;
  const nextDay = dIdx < week.days.length - 1 ? week.days[dIdx + 1] : null;
  nav.innerHTML = `
    ${prevDay ? `<button class="day-nav-btn" data-dir="prev">← ${prevDay.label}</button>` : ''}
    ${nextDay ? `<button class="day-nav-btn forward" data-dir="next" style="color:${accent};border-color:${accent}20">${nextDay.label} →</button>` : ''}
  `;
  nav.querySelectorAll('.day-nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.dir === 'prev') state.selectedDay--;
      else state.selectedDay++;
      renderDayView();
    });
  });
}

// ════════════════════════════════════════════════════════════
// EVENTS
// ════════════════════════════════════════════════════════════

document.getElementById('back-btn').addEventListener('click', showWeekView);

document.getElementById('mark-done-btn').addEventListener('click', () => {
  toggleWorkout(state.selectedWeek, state.selectedDay);
  renderDayView();
});

// INIT
// ════════════════════════════════════════════════════════════
(async () => { await loadState(); renderWeekList(); })();
